plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+fabric-${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    // Mods it needs or works with (Forge Config API Port, Jade, JEI), from Modrinth.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// The game tests are their own small mod (src/gametest): never in the released jar.
sourceSets {
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    accessWidenerPath = file('src/main/resources/villagerhuts.accesswidener')

    mods {
        villagerhuts {
            sourceSet sourceSets.main
        }
        villagerhuts_tests {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        // ./gradlew runGameTest: a flat dev server that runs every test, then stops (exit code 1 if any failed).
        gameTest {
            server()
            name 'Game Tests'
            runDir 'run-gametest'
            source sourceSets.gametest
            vmArg '-Dvillagerhuts.gametest=true'
            programArg '--nogui'
        }
    }
}

// The test server's settings: a flat world, no structures, offline (written before every run).
tasks.matching { it.name == 'runGameTest' }.configureEach {
    doFirst {
        def dir = file('run-gametest')
        dir.mkdirs()
        new File(dir, 'eula.txt').text = 'eula=true\n'
        new File(dir, 'server.properties').text = ['level-type=minecraft\\:flat', 'generate-structures=false', 'online-mode=false',
                'spawn-protection=0', 'level-name=gametest-world', 'max-tick-time=-1',
                'pause-when-empty-seconds=-1'].join('\n') + '\n'
        delete new File(dir, 'gametest-world')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Settings (NeoForge's config API on Fabric): required, and in the Seed to Stars pack.
    implementation "maven.modrinth:forge-config-api-port:${forge_config_api_port_version}"
    // Optional mods (the compat package): compile time only, never shipped or required.
    compileOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "maven.modrinth:jei:${jei_version}"
    // @Nullable on types (compile time only; Minecraft ships jspecify).
    compileOnly 'org.jspecify:jspecify:1.0.0'
    gametestCompileOnly 'org.jspecify:jspecify:1.0.0'
}

processResources {
    def props = [version: project.version, mod_name: mod_name]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs << '-Xmaxerrs' << '2000'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
